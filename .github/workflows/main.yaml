name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check formatting
        uses: super-linter/super-linter@v8
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_PYTHON_BLACK: true
          VALIDATE_SNAKEMAKE_SNAKEFMT: true
          VALIDATE_YAML_PRETTIER: true

  linting:
    name: Snakemake lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Lint workflow
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .test
          snakefile: workflow/Snakefile
          args: --lint --configfile .test/config/config.inference.yaml
          snakemake-version: 9.19.0

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            tests/requirements-workflow.txt
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements-workflow.txt
      - name: Run Python tests
        run: python -m pytest -q -ra tests

  testing:
    name: Testing (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [formatting, linting, python-tests]
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: inference enabled
            id: inference
            config: config.inference.yaml
          - name: inference disabled
            id: no-inference
            config: config.no_inference.yaml
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install assertion dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Run fixture workflow
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .test
          snakefile: workflow/Snakefile
          args: >-
            --configfile .test/config/${{ matrix.suite.config }}
            --cores 2
            --software-deployment-method conda
            --show-failed-logs
            --conda-cleanup-pkgs cache
          show-disk-usage-on-error: true
          snakemake-version: 9.19.0
      - name: Assert workflow suite outputs
        run: >-
          python tests/assert_workflow_case_outputs.py
          --suite ${{ matrix.suite.id }}
          --workdir .test
      - name: Generate Snakemake report
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .test
          snakefile: workflow/Snakefile
          args: >-
            --report snakemake-report-${{ matrix.suite.id }}.zip
            --configfile .test/config/${{ matrix.suite.config }}
            --software-deployment-method conda
          show-disk-usage-on-error: true
          snakemake-version: 9.19.0
      - name: Upload Snakemake report
        uses: actions/upload-artifact@v4
        with:
          name: snakemake-report-${{ matrix.suite.id }}
          path: .test/snakemake-report-${{ matrix.suite.id }}.zip
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
